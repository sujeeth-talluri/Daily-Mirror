name: Build site

# Runs the required publish pipeline automatically on every push to main, so
# adding an entries/*.md file and pushing is the whole workflow — no need to
# remember to run build_index.py / build_feed.py / build_pages.py by hand.
#
# generate_social_images.py (OG + Instagram Story cards) runs here too, using
# fonts bundled in fonts/ rather than the old generate_og_images.py's
# Windows-only C:/Windows/Fonts/ paths — that's what makes image generation
# "automatic" instead of a manual local step. It has its own step with
# continue-on-error: publishing the reflection matters more than generating
# its share images (see that script's docstring) — a failure there shows as
# a visible warning on this workflow but never blocks the commit/push of
# everything else. generate_icons.py still isn't run here: it's a one-off,
# not part of the daily flow (only re-run locally if the site's mark changes).
#
# Ordering matters: generate_social_images.py must run between build_index.py
# and build_pages.py, not after. build_pages.py decides each entry's og:image
# by checking whether og/<slug>.png already exists on disk — running it first
# meant every brand-new entry's page shipped with the generic fallback image
# for its first day, only self-correcting on the next day's rebuild (caught
# publishing Day 48, the first entry that also exposed the escape_attr bug).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No cache: 'pip' here — that option needs a requirements.txt/
          # pyproject.toml to hash for a cache key, which this repo
          # deliberately doesn't have, and setup-python fails outright
          # without one rather than just skipping the cache (confirmed:
          # broke the very first real run of this workflow). Pillow is one
          # small package; installing it fresh each run is fast enough that
          # caching isn't worth a fragile new file to maintain.

      - name: Install Pillow (needed only for social image generation)
        run: pip install Pillow

      - name: Build entries index
        run: python scripts/build_index.py

      - name: Generate social share images (OG + Story cards)
        continue-on-error: true
        run: python scripts/generate_social_images.py

      - name: Build feed and entry pages
        run: |
          python scripts/build_feed.py
          python scripts/build_pages.py

      - name: Commit generated files if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries.json feed.xml entry/ sitemap.xml robots.txt og/ stories/
          if git diff --cached --quiet; then
            echo "Nothing to commit — generated output already up to date."
          else
            git commit -m "Auto-build: regenerate entries.json, feed.xml, entry pages, sitemap, social images"
            git push
          fi
